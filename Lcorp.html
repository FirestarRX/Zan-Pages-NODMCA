<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <title>Lobotomy Corporation</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #08080a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #unityContainer {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #08080a;
        }

        #loader-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #12131a 0%, #08080a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease-in-out;
        }

        .loader-content {
            text-align: center;
            width: 80%;
            max-width: 450px;
        }

        .game-title {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #ffffff;
            margin-bottom: 2.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
        }

        .progress-container {
            width: 100%;
            height: 4px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 1.2rem;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.5);
            border-radius: 2px;
            transition: width 0.15s ease-out;
        }

        .progress-text {
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.1em;
            color: #94a3b8;
            text-transform: uppercase;
        }

        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 5;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            display: none;
            align-items: center;
            justify-content: center;
            outline: none;
        }

        #fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }
    </style>
</head>

<body>
<div id="unityContainer"></div>
<div id="loader-overlay">
    <div class="loader-content">
        <div class="game-title">LOBOTOMY CORPORATION</div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div id="progress-text" class="progress-text">Loading Assets... 0%</div>
    </div>
</div>
<button id="fullscreen-btn">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"
         stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px; vertical-align: middle;">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
    <span style="vertical-align: middle;">FULLSCREEN</span>
</button>
<script src="https://cdn.jsdelivr.net/gh/Reeyuki/lobcorp@main/Build/UnityLoader.js"></script>
<script>
    (function () {
        const CDN = 'https://cdn.jsdelivr.net/gh/Reeyuki/lobcorp@main/Build/';
        const MAX_PARALLEL = 6;   // simultaneous downloads (lower = less peak memory)
        const MAX_RETRIES = 3;    // per-file retries before giving up

        // ---- Download manifest -------------------------------------------------
        const tasks = [
            { name: 'web.json', size: 501, type: 'text' },
            { name: 'web.wasm.framework.unityweb', size: 95575, type: 'blob' },
            { name: 'web.wasm.code.unityweb', size: 8211250, type: 'blob' }
        ];
        const dataCount = 58;
        for (let i = 0; i < dataCount; i++) {
            tasks.push({
                name: 'web.data.unityweb' + String(i).padStart(2, '0'),
                size: i === dataCount - 1 ? 11890053 : 20971520,
                type: 'blob'
            });
        }

        const progressText = document.getElementById('progress-text');
        const progressBar = document.getElementById('progress-bar');
        const loaderOverlay = document.getElementById('loader-overlay');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        const totalBytes = tasks.reduce((sum, t) => sum + t.size, 0);
        let loadedBytes = 0;

        function addBytes(delta) {
            loadedBytes += delta;
            const pct = Math.max(0, Math.min(100, Math.round((loadedBytes / totalBytes) * 100)));
            progressText.textContent = 'Loading Assets... ' + pct + '%';
            progressBar.style.width = pct + '%';
        }

        // ---- Downloading -------------------------------------------------------
        // One attempt at one file. Progress is rolled back if the attempt fails,
        // so retries never push the bar past 100%.
        function attempt(task) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', CDN + task.name);
                xhr.responseType = task.type;
                let last = 0;
                const fail = () => { addBytes(-last); reject(new Error(task.name)); };
                xhr.onprogress = (e) => {
                    const loaded = e.loaded || 0;
                    addBytes(loaded - last);
                    last = loaded;
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        addBytes(task.size - last); // snap to the expected size
                        resolve(xhr.response);
                    } else {
                        fail();
                    }
                };
                xhr.onerror = fail;
                xhr.ontimeout = fail;
                xhr.send();
            });
        }

        async function download(task) {
            let lastError;
            for (let i = 0; i <= MAX_RETRIES; i++) {
                try {
                    return await attempt(task);
                } catch (err) {
                    lastError = err;
                    await new Promise(r => setTimeout(r, 500 * (i + 1)));
                }
            }
            throw lastError;
        }

        // Worker-pool style: MAX_PARALLEL workers pull the next task off the queue.
        async function downloadAll() {
            const results = new Array(tasks.length);
            let next = 0;
            const worker = async () => {
                while (next < tasks.length) {
                    const i = next++;
                    results[i] = await download(tasks[i]);
                }
            };
            await Promise.all(Array.from({ length: MAX_PARALLEL }, worker));
            return results;
        }

        // ---- Hand the files to UnityLoader ------------------------------------
        // Unity's cache layer can request the same URL more than once, so the
        // redirects must stay in place for the whole load. Blob URLs are only
        // revoked after the game has fully started.
        const REVOKE_AFTER_LOAD = true;

        // Unity's .unityweb files are plain gzip with a comment header. Decompressing
        // them here with the browser's native code is much faster than Unity's
        // JavaScript fallback. If anything goes wrong we hand Unity the original file.
        const NATIVE_DECOMPRESS = true;
        // The decompressed data is larger, so Unity's IndexedDB copy would be too.
        // (Unity's cache is untested with this; harmless if the loader ignores it.)
        const DISABLE_UNITY_CACHE = true;

        async function gunzip(blob, label) {
            let done = 0;
            const counter = new TransformStream({
                transform(chunk, controller) {
                    done += chunk.byteLength;
                    const pct = Math.min(100, Math.round((done / blob.size) * 100));
                    progressText.textContent = 'Decompressing ' + label + '... ' + pct + '%';
                    progressBar.style.width = pct + '%';
                    controller.enqueue(chunk);
                }
            });
            const out = blob.stream().pipeThrough(counter).pipeThrough(new DecompressionStream('gzip'));
            return new Response(out).blob();
        }

        async function maybeGunzip(blob, label) {
            if (!NATIVE_DECOMPRESS || typeof DecompressionStream !== 'function') return blob;
            try {
                const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
                if (head[0] !== 0x1f || head[1] !== 0x8b) return blob; // not gzip
                return await gunzip(blob, label);
            } catch (e) {
                console.warn('Native decompression failed for ' + label + ', using original file:', e);
                return blob;
            }
        }

        async function start(results) {
            const dataRaw = new Blob(results.slice(3), { type: 'application/octet-stream' });
            const jsonBlob = new Blob([results[0]], { type: 'application/json' });
            const frameworkBlob = await maybeGunzip(results[1], 'engine');
            const codeBlob = await maybeGunzip(results[2], 'code');
            const dataBlob = await maybeGunzip(dataRaw, 'game data');

            const urls = {
                'web.json': URL.createObjectURL(jsonBlob),
                'web.wasm.framework.unityweb': URL.createObjectURL(frameworkBlob),
                'web.wasm.code.unityweb': URL.createObjectURL(codeBlob),
                'web.data.unityweb': URL.createObjectURL(dataBlob)
            };

            // Drop our own references to the downloaded pieces.
            results.length = 0;

            function lookup(url) {
                if (typeof url !== 'string') return null;
                for (const key in urls) {
                    if (url.endsWith(key)) return urls[key];
                }
                return null;
            }

            const originalOpen = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (method, url, ...args) {
                const redirected = lookup(url);
                if (redirected) url = redirected;
                return originalOpen.call(this, method, url, ...args);
            };

            const originalFetch = window.fetch;
            window.fetch = function (input, init) {
                const rawUrl = typeof input === 'string' ? input : (input instanceof Request ? input.url : '');
                const redirected = lookup(rawUrl);
                if (redirected) {
                    input = input instanceof Request ? new Request(redirected, input) : redirected;
                }
                return originalFetch.call(this, input, init);
            };

            progressText.textContent = 'Initializing Game...';
            progressBar.style.width = '100%';

            let released = false;
            const unityInstance = UnityLoader.instantiate('unityContainer', 'Build/web.json', {
                Module: DISABLE_UNITY_CACHE ? { cacheControl: function () { return 'no-store'; } } : {},
                onProgress: function (instance, progress) {
                    if (progress === 1) {
                        if (REVOKE_AFTER_LOAD && !released) {
                            released = true;
                            for (const key in urls) URL.revokeObjectURL(urls[key]);
                        }
                        loaderOverlay.style.opacity = 0;
                        setTimeout(() => {
                            loaderOverlay.style.display = 'none';
                            fullscreenBtn.style.display = 'flex';
                        }, 500);
                    }
                }
            });

            fullscreenBtn.onclick = () => {
                unityInstance.SetFullscreen(1);
            };
        }

        downloadAll().then(start).catch(err => {
            progressText.textContent = 'Error: ' + err.message;
            progressText.style.color = '#ef4444';
        });
    })();
</script>

</html>
